version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: django_dev
    env_file: 
      - .env
    environment:
      - DEBUG=1
      - ALLOWED_HOSTS=*
      - PYTHONPATH=/app/tutors_django
    depends_on:
      - db
      - redis  # Ensure Redis starts before Django
    volumes:
      - .:/app
    working_dir: /app
    command: ["/usr/local/bin/supervisord", "-c", "/etc/supervisord.conf"]
    ports:
      - "8000:8000"
      - "8001:8001"

  db:
    image: postgres:16.6
    container_name: postgres_dev
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres 
      - POSTGRES_DB=edudb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: redis_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  pgdata:
  redisdata:


