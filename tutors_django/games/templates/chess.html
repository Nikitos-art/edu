{% extends 'base.html' %}
{% load static %}

{% block head %}
    <meta name="keywords" content="Chess">
{% endblock %}

{% block title %}Chess{% endblock %}

{% block css %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles/chess.css' %}">
{% endblock %}

{% block site_content %}
<div class="chess-wrapper">

    <div class="coordinates-hor">
        <div class="row-coord">a</div>
        <div class="row-coord">b</div>
        <div class="row-coord">c</div>
        <div class="row-coord">d</div>
        <div class="row-coord">e</div>
        <div class="row-coord">f</div>
        <div class="row-coord">g</div>
        <div class="row-coord">h</div>
    </div>
    <div class="chess-container">
        <div class="coordinates-virt">
            <div class="col-coord">8</div>
            <div class="col-coord">7</div>
            <div class="col-coord">6</div>
            <div class="col-coord">5</div>
            <div class="col-coord">4</div>
            <div class="col-coord">3</div>
            <div class="col-coord">2</div>
            <div class="col-coord">1</div>
        </div>
        <div id="chessboard"></div>
    </div>
    <div id="playerTurn">Current Player: White</div>
</div>
{% block script %}
    <script src="{% static 'js/chess/game_logic.js' %}" defer type="module" ></script>
{% endblock %}
{% endblock %}
